<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableHop - Hackathon Prototype</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #1e293b;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            min-height: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background: linear-gradient(to bottom, #4f46e5, #312e81);
            text-align: center;
        }
        .emoji-icon {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 16px;
            font-size: 40px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 36px;
            font-weight: 800;
            margin: 0 0 8px 0;
        }
        .subtitle {
            color: #c7d2fe;
            font-size: 16px;
            margin: 0 0 48px 0;
        }
        .btn-primary {
            width: 100%;
            background-color: #ffffff;
            color: #4f46e5;
            font-weight: bold;
            font-size: 16px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .board-screen {
            padding: 24px;
            flex: 1;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .table-card {
            background-color: rgba(51, 65, 85, 0.5);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .badge {
            background-color: rgba(79, 70, 229, 0.2);
            color: #818cf8;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 9999px;
            text-transform: uppercase;
        }
        .btn-join {
            width: 100%;
            background-color: #0f172a;
            color: #818cf8;
            border: 1px solid rgba(129, 140, 248, 0.3);
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- APP CONTAINER -->
    <div class="app-container">
        
        <!-- ================= WELCOME SCREEN ================= -->
        <div id="welcome-screen" class="welcome-screen">
            <div class="emoji-icon">🍔</div>
            <h1>TableHop</h1>
            <p class="subtitle">Never eat lunch alone again.</p>
            <!-- Directly changing layout style on click -->
            <button onclick="document.getElementById('welcome-screen').style.display='none'; document.getElementById('board-screen').style.display='block';" class="btn-primary">
                Find a Table
            </button>
        </div>

        <!-- ================= LIVE BOARD SCREEN ================= -->
        <div id="board-screen" class="board-screen" style="display: none;">
            <div class="header-row">
                <div>
                    <h2 style="margin:0;">Live Cafeteria</h2>
                    <p style="margin:4px 0 0 0; font-size:12px; color:#94a3b8;">Find a group to join right now</p>
                </div>
            </div>

            <!-- Card 1 -->
            <div class="table-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                    <span class="badge">Anime</span>
                    <span style="font-size:12px; color:#94a3b8;">3/5 seats full</span>
                </div>
                <h3 style="margin:0 0 4px 0; font-size:16px;">"Discussing the latest Chainsaw Man chapter!"</h3>
                <p style="margin:0 0 16px 0; font-size:12px; color:#94a3b8;">Hosted by Sarah M.</p>
                <button class="btn-join" onclick="alert('You hopped into Sarah\'s table! See you at lunch.')">Hop In Table</button>
            </div>

            <!-- Card 2 -->
            <div class="table-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                    <span class="badge">Gaming</span>
                    <span style="font-size:12px; color:#94a3b8;">2/4 seats full</span>
                </div>
                <h3 style="margin:0 0 4px 0; font-size:16px;">"Casual chess matches. Beginners welcome!"</h3>
                <p style="margin:0 0 16px 0; font-size:12px; color:#94a3b8;">Hosted by Marcus K.</p>
                <button class="btn-join" onclick="alert('You hopped into Marcus\'s table! See you at lunch.')">Hop In Table</button>
            </div>
        </div>

    </div>

</body>
</html>
